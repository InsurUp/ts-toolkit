name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for pkg in contracts sdk table-adapter-core table-adapter-react table-adapter-vue table-adapter-svelte; do
            jq --arg v "$VERSION" '.version = $v' packages/$pkg/package.json > tmp.json
            mv tmp.json packages/$pkg/package.json
          done

      - run: bun install

      # Refresh bun.lock so workspace:* references resolve to the bumped versions.
      # `bun publish` reads workspace versions from the lockfile (oven-sh/bun#24687),
      # so without this the published manifests get stale @insurup/* pins.
      - run: bun update

      - run: bun run build

      - run: bun run test

      - name: Publish packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish in dependency order - bun publish auto-converts workspace:* to versions
          cd packages/contracts && bun publish --access public
          cd ../sdk && bun publish --access public
          cd ../table-adapter-core && bun publish --access public
          cd ../table-adapter-react && bun publish --access public
          cd ../table-adapter-vue && bun publish --access public
          cd ../table-adapter-svelte && bun publish --access public

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main
