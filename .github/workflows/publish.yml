name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for pkg in contracts sdk table-adapter-core table-adapter-react table-adapter-vue table-adapter-svelte; do
            jq --arg v "$VERSION" '.version = $v' packages/$pkg/package.json > tmp.json
            mv tmp.json packages/$pkg/package.json
          done

      - run: bun install

      - run: bun run build

      - run: bun run test

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish packages
        run: |
          # Publish in dependency order
          cd packages/contracts && npm publish --access public
          cd ../sdk && npm publish --access public
          cd ../table-adapter-core && npm publish --access public
          cd ../table-adapter-react && npm publish --access public
          cd ../table-adapter-vue && npm publish --access public
          cd ../table-adapter-svelte && npm publish --access public

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main
